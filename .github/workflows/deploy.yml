name: Deploy to SiteGround

# Push to main -> the live site updates. Nothing else needs doing.
#
# The SiteGround credentials live in GitHub repository secrets and are never
# stored in this repo:
#   SG_HOST     hostname or IP of the SiteGround server
#   SG_USER     SSH username from Site Tools > Devs > SSH Keys Manager
#   SG_PATH     absolute path to the web root, WITH a trailing slash
#               e.g. /home/customer/www/ashvand.org/public_html/
#   SG_SSH_KEY  the full private key, including the BEGIN/END lines

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prune:
        description: "Also delete remote files that no longer exist in the repo"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # SiteGround runs SSH/SFTP on a non-standard port.
  SG_PORT: "18765"
  SITE_URL: "https://ashvand.org"

jobs:
  deploy:
    name: rsync to public_html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Refuse to ship if the API key has leaked into the repo.
      # ---------------------------------------------------------------
      - name: Pre-flight secret scan
        run: |
          set -euo pipefail
          if [ -e config.php ]; then
            echo "::error::config.php exists in the repo. It must live only on the server."
            exit 1
          fi
          if grep -rIn --exclude-dir=.git --exclude=config.sample.php \
               -E 'sk-ant-[A-Za-z0-9_-]{20,}' . ; then
            echo "::error::A live-looking Anthropic API key is present in the tree. Aborting."
            exit 1
          fi
          echo "Clean: no key material in the tree."

      # ---------------------------------------------------------------
      # SiteGround intermittently drops the first SSH connection, so a
      # single ssh-keyscan is unreliable — retry it.
      #
      # The retrieved host key is checked against a fingerprint pinned
      # here, recorded from a verified manual login on 2026-08-10. That
      # is stronger than trust-on-first-use: a MITM during the scan is
      # caught rather than cached. If SiteGround legitimately rotates
      # its host key, this step fails loudly and the fingerprint below
      # must be updated deliberately.
      # ---------------------------------------------------------------
      # ---------------------------------------------------------------
      # Build the static language editions. Generated pages are never
      # committed: template.html + i18n/*.json are the source of truth,
      # and the build fails loudly on any missing or unknown key rather
      # than shipping a page with @@nav.03@@ visible to a reader.
      # ---------------------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build language editions
        run: |
          set -euo pipefail
          node build.js
          test -s dist/index.html || { echo "::error::build produced no English page"; exit 1; }
          # Text files only: favicon.ico contains the byte sequence '@@a',
          # and a binary false positive here would fail every deploy.
          if grep -rqI --include='*.html' --include='*.xml' '@@[A-Za-z]' dist/; then
            echo "::error::an unreplaced placeholder reached the output"
            grep -rnI --include='*.html' -o '@@[A-Za-z.]*@@' dist/ | head; exit 1
          fi
          echo "Editions built:"; find dist -name index.html | sort | sed 's/^/  /'

      - name: Configure SSH
        env:
          EXPECTED_HOST_FP: "SHA256:GGQa+ugTNisCm+Rv6LvbJx694twrBVv+BlKi2enfjdg"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null \
            || { echo "::error::SG_SSH_KEY is not a valid passphrase-free private key."; exit 1; }

          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 20 -t ed25519 -p "$SG_PORT" "${{ secrets.SG_HOST }}" > /tmp/hostkey 2>/tmp/hostkey.err || true
            if [ -s /tmp/hostkey ]; then
              echo "Host key retrieved on attempt $attempt."
              break
            fi
            echo "Attempt $attempt returned no host key; retrying in $((attempt * 5))s"
            sed 's/^/  keyscan: /' /tmp/hostkey.err || true
            sleep $((attempt * 5))
          done

          if [ ! -s /tmp/hostkey ]; then
            echo "::error::Could not retrieve the SiteGround host key after 5 attempts. The server may be refusing connections from this runner. Re-run the workflow; if it keeps failing, check Site Tools for an IP block."
            exit 1
          fi

          GOT_FP="$(ssh-keygen -lf /tmp/hostkey | awk '{print $2}')"
          if [ "$GOT_FP" != "$EXPECTED_HOST_FP" ]; then
            echo "::error::Host key fingerprint mismatch. Expected $EXPECTED_HOST_FP but got $GOT_FP. Refusing to connect. Either SiteGround rotated the key (update EXPECTED_HOST_FP in this workflow) or something is intercepting the connection."
            exit 1
          fi
          echo "Host fingerprint verified: $GOT_FP"
          cat /tmp/hostkey >> ~/.ssh/known_hosts

      # ---------------------------------------------------------------
      # rsync includes dotfiles by default, so .htaccess ships. That
      # matters: .htaccess is what makes config.php return 403.
      #
      # --delete is OFF unless you run the workflow manually and tick
      # "prune". Excluded paths (config.php, .ratelimit/) are protected
      # from deletion either way.
      # ---------------------------------------------------------------
      - name: Deploy dist/ to public_html
        run: |
          set -euo pipefail
          PRUNE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prune }}" = "true" ]; then
            PRUNE="--delete"
            echo "Pruning enabled: remote files absent from the repo will be removed."
          fi
          rsync -rltvz --checksum $PRUNE \
            --exclude-from=.deployignore \
            -e "ssh -i ~/.ssh/deploy_key -p $SG_PORT -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_PATH }}"

      # ---------------------------------------------------------------
      # AUTHORITATIVE CHECK. Runs on the server itself, so it is not
      # subject to the bot-protection layer that answers GitHub's runner
      # IPs with HTTP 202 instead of passing them through to Apache.
      # ---------------------------------------------------------------
      - name: Verify on the server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$SG_PORT" -o StrictHostKeyChecking=yes \
            "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}" 'bash -s' -- "${{ secrets.SG_PATH }}" \
            < .github/verify-remote.sh

      # ---------------------------------------------------------------
      # EXTERNAL CANARY. Best effort only. SiteGround's bot protection
      # answers datacenter IPs with 202 regardless of the real response,
      # so this must never fail a deploy on status code alone -- that
      # would be a false alarm on every run. It fails hard on one thing
      # only: key material actually appearing in a response body, which
      # is unambiguous no matter what the status code says.
      # ---------------------------------------------------------------
      - name: External canary
        if: always()
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36'
          fail=0
          probe() {
            curl -sSL -A "$UA" -H 'Accept-Language: en-US,en;q=0.9' \
                 -o "$2" -w '%{http_code}' --max-time 20 "$1" 2>/dev/null || echo 000
          }

          code=$(probe "$SITE_URL/config.php" /tmp/cfg.txt)
          echo "config.php  -> HTTP $code"
          if grep -qi 'ANTHROPIC_API_KEY\|sk-ant-' /tmp/cfg.txt 2>/dev/null; then
            echo "::error::config.php served key material. ROTATE THE API KEY NOW."
            fail=1
          else
            case "$code" in
              403|404) echo "  ok: refused" ;;
              202)     echo "::warning::Inconclusive - bot protection answered 202. The server-side check is authoritative." ;;
              *)       echo "::warning::Unexpected status $code, but no key material in the body." ;;
            esac
          fi

          code=$(probe "$SITE_URL/" /tmp/home.html)
          echo "homepage    -> HTTP $code"
          if [ "$code" = "200" ]; then
            grep -qi 'ashvand' /tmp/home.html \
              && echo "  ok: real content served" \
              || echo "::warning::200 but expected content not found"
          else
            echo "::warning::Inconclusive - status $code"
          fi

          code=$(probe "$SITE_URL/daanaa.php" /tmp/dn.txt)
          echo "daanaa.php  -> HTTP $code"
          if grep -qi 'ANTHROPIC_API_KEY\|<?php' /tmp/dn.txt 2>/dev/null; then
            echo "::error::daanaa.php served PHP source instead of executing. ROTATE THE API KEY NOW."
            fail=1
          else
            case "$code" in
              5*|000) echo "::warning::Inconclusive or server error: $code" ;;
              *)      echo "  ok: endpoint alive" ;;
            esac
          fi

          exit $fail

      - name: Reminder
        if: success()
        run: |
          echo "Deployed. SiteGround caches aggressively — if the change is not visible,"
          echo "flush the cache in Site Tools > Speed > Caching, then hard-refresh."
